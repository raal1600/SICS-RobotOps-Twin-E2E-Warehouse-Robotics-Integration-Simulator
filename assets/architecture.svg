<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Systemgränser och ägarskap</title><desc id="desc">Figur 2. Egen komponentarkitektur. Integrationskärnan äger uppdraget; Blender äger simulatortillståndet. Verifiering lagras och återkopplas till kunden. Dubbelriktade pilar anger begäran/svar eller läsning/återkoppling, inte gemensamma transaktioner. Celltillåtelse är här en logisk emulering. Windows desktop owns its local API and Blender process lifetime; durable journals survive window closure. The human replay view reads recorded Blender poses; it is not sensor evidence and has no path into Verifier.</desc>
