name: Deterministic acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked
      - name: Deterministic suite
        run: uv run --locked python -m tools.dev test --junitxml=artifacts/tests.xml
      - name: Lint and format
        run: uv run --locked python -m tools.dev lint
      - name: Strict types
        run: uv run --locked python -m tools.dev typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evidence
          path: artifacts/
          if-no-files-found: error
