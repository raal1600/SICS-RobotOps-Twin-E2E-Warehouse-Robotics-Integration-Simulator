name: Windows desktop launcher
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        env:
          # The hosted workspace repeats the repository name; archived evidence
          # paths can exceed Windows MAX_PATH before any test is able to run.
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install locked Python environment
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked --all-groups
      - name: Compile checksum-pinned desktop host
        shell: powershell
        run: ./tools/build-desktop.ps1 -RestoreDependencies
      - name: Test actual window ownership, close and restart
        shell: powershell
        run: ./tools/test-desktop.ps1 -Runtime headless
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-evidence
          path: |
            artifacts/desktop/RobotOps Twin/
            artifacts/desktop-smoke/**/evidence.json
            artifacts/desktop-smoke/**/sessions/
          if-no-files-found: error
