<path d="M 450 870 V 910" fill="none" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="240" y="95" width="420" height="105" rx="7" fill="#eef2f6" stroke="#182f43" stroke-width="1.3"/>
