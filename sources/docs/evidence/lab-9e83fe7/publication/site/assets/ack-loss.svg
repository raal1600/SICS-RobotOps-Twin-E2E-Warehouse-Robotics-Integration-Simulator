<svg xmlns="http://www.w3.org/2000/svg" width="900" height="795" viewBox="0 0 900 795" role="img" aria-labelledby="title desc">
<title id="title">Utfört plock — förlorad kvittens</title><desc id="desc">Figur 4. Egen sekvensmodell. Effekten uppstår före kommunikationsfelet. Integrationen begär kommandostatus och observation, inte ett nytt plock. Endast tillräcklig och konsistent evidens tillåter slutförande; annars krävs fortsatt utredning. Efter otillräcklig evidens kan operatören uttryckligen upprepa steg 6–9 för samma kommando. Varje bedömning sparas; ingen ny plockeffekt begärs. Verktygsförberedelse i HKM-revisionen hör till samma kommando och ändrar inte denna avstämningsregel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526473"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a34838"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="28" y="34" font-size="23" text-anchor="start" fill="#182f43" font-weight="700">Utfört plock — förlorad kvittens</text>
<text x="28" y="62" font-size="16" text-anchor="start" fill="#526473" font-weight="400">Implemented against headless and Blender runtimes</text>
<rect x="15" y="90" width="190" height="48" rx="6" fill="#edf6f5" stroke="#a5c6c7"/>
<text x="110" y="120" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">Integration</text>
<path d="M 110 140 V 710" stroke="#c3d0d8" stroke-dasharray="6 6"/>
<rect x="245" y="90" width="190" height="48" rx="6" fill="#edf6f5" stroke="#a5c6c7"/>
<text x="340" y="120" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">RobotGateway</text>
<path d="M 340 140 V 710" stroke="#c3d0d8" stroke-dasharray="6 6"/>
<rect x="475" y="90" width="190" height="48" rx="6" fill="#edf6f5" stroke="#a5c6c7"/>
<text x="570" y="120" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">World + Observer</text>
<path d="M 570 140 V 710" stroke="#c3d0d8" stroke-dasharray="6 6"/>
<rect x="695" y="90" width="190" height="48" rx="6" fill="#edf6f5" stroke="#a5c6c7"/>
<text x="790" y="120" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">Verifierare</text>
<path d="M 790 140 V 710" stroke="#c3d0d8" stroke-dasharray="6 6"/>
<path d="M 110 175 H 340" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="225" y="163" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">1. Skicka CMD-17</text>
<path d="M 340 235 H 570" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="455" y="223" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">2. Utför samma kommando</text>
<rect x="420" y="272" width="310" height="43" rx="4" fill="#fbf4e6" stroke="#d7c192"/>
<text x="575" y="299" font-size="16" text-anchor="middle" fill="#182f43" font-weight="400">3. Objekt flyttas; effekt sparas</text>
<path d="M 340 355 H 110" stroke="#a34838" stroke-width="2" marker-end="url(#red)" stroke-dasharray="7 5"/>
<text x="225" y="343" font-size="16" text-anchor="middle" fill="#a34838" font-weight="400">4. Kvittens försvinner</text>
<path d="M 218.0 348 l 14 14 M 218.0 362 l 14 -14" stroke="#a34838" stroke-width="3"/>
<rect x="20" y="392" width="310" height="43" rx="4" fill="#fbf4e6" stroke="#d7c192"/>
<text x="175" y="419" font-size="16" text-anchor="middle" fill="#182f43" font-weight="400">5. UNKNOWN_OUTCOME</text>
<path d="M 110 475 H 340" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="225" y="463" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">6. Läs status för CMD-17</text>
<path d="M 570 535 H 790" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="680" y="523" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">7. Ny WorldObservation</text>
<path d="M 340 595 H 790" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="565" y="583" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">8. Journal + samma epok</text>
<path d="M 790 655 H 110" stroke="#526473" stroke-width="2" marker-end="url(#arrow)"/>
<text x="450" y="643" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">9. Tillräcklig evidens → verifierat; annars granskning</text>
<text x="28" y="755" font-size="18" text-anchor="start" fill="#126b70" font-weight="700">Ingen ny PICK skickas under avstämningen.</text>
</g></svg>