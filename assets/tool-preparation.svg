<text x="450" y="141.5" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">Original PICK_AND_PLACE command</text>
<text x="450" y="167.5" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">Identity / payload / validated tool</text>
<rect x="40" y="260" width="350" height="100" rx="7" fill="#edf6f5" stroke="#126b70" stroke-width="1.3"/>
