<text x="450" y="811.5" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">PLACE / RELEASE / PICK_EFFECT</text>
<text x="450" y="837.5" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">Exactly one product-transfer effect</text>
<rect x="240" y="910" width="420" height="100" rx="7" fill="#eef2f6" stroke="#182f43" stroke-width="1.3"/>
<rect x="240" y="920" width="4" height="80" rx="2" fill="#182f43"/>
<text x="450" y="954" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">Observation and verification</text>
<text x="450" y="980" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">Receipt alone cannot complete order</text>
<text x="28" y="1028" font-size="15" text-anchor="start" fill="#526473" font-weight="400">Tool changes are preparation sub-operations, never replacement business pick commands.</text>
