name: Build and publish research reports

on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'publication/**'
      - 'tools/build_publication.py'
      - 'requirements-docs.txt'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'PUBLICATION.md'
      - 'docs/**'
      - 'contracts/**'
      - 'CITATION.cff'
      - 'README.md'
      - 'PROJECT_PLAN.md'
      - 'SUCCESS_CRITERIA.md'
      - 'HANDOFF.md'
      - 'CODEX_GOAL_CHECKLIST.md'
      - 'GOAL_PROGRESS.md'
      - 'ACCEPTANCE_REPORT.md'
      - '.github/workflows/publish-reports.yml'
  workflow_dispatch:

concurrency:
  group: robotops-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install PDF rendering system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - name: Install pinned publication toolchain
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked --only-group docs
      - name: Build HTML, diagrams, references and PDFs
        run: uv run --locked --only-group docs python tools/build_publication.py
      - name: Archive complete publication for inspection
        uses: actions/upload-artifact@v4
        with:
          name: robotops-publication
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retain generated publication and PDF downloads in gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/robotops-published"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add -B gh-pages "$target" origin/gh-pages
          else
            git worktree add --detach "$target" HEAD
            (cd "$target" && git switch --orphan gh-pages)
          fi
          rsync -a --delete --exclude='.git' _site/ "$target/"
          cd "$target"
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish documentation from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Package GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publication summary
        run: |
          echo '## RobotOps Twin publication' >> "$GITHUB_STEP_SUMMARY"
          cat _site/build.json >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTML, diagram and PDF responses
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          commit=os.environ['GITHUB_SHA']
          def get(path):
              request=urllib.request.Request(base+path+'?verify='+commit, headers={'User-Agent':'RobotOps-Publication-Smoke-Test','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  return response.status,response.headers.get_content_type(),response.read()
          for attempt in range(12):
              try:
                  status,ctype,raw=get('build.json')
                  manifest=json.loads(raw)
                  if manifest['source_commit']==commit:
                      break
              except Exception:
                  if attempt==11:
                      raise
              time.sleep(10)
          else:
              raise RuntimeError('Pages did not expose the current publication commit')
          checks=[]
          for name in ['index','design','avgransning','diskussion','kallor','diagram','governance']:
              path=name+'.html'; status,ctype,data=get(path)
              assert status==200 and ctype=='text/html' and b'RobotOps Twin' in data, path
              checks.append({'path':path,'status':status,'content_type':ctype,'bytes':len(data)})
          for report in manifest['reports']:
              path='downloads/'+report['report']+'.pdf'; status,ctype,data=get(path)
              digest=hashlib.sha256(data).hexdigest()
              assert status==200 and data.startswith(b'%PDF-') and digest==report['pdf_sha256'], path
              checks.append({'path':path,'status':status,'content_type':ctype,'sha256':digest,'bytes':len(data)})
          path='downloads/robotops-twin-samlat.pdf';status,ctype,data=get(path)
          assert status==200 and data.startswith(b'%PDF-') and len(data)>10000,path
          checks.append({'path':path,'status':status,'content_type':ctype,'bytes':len(data)})
          for name in ['context','architecture','state','ack-loss','worlds','trust','boundary']:
              path='assets/'+name+'.svg';status,ctype,data=get(path)
              assert status==200 and b'<svg' in data,path
              checks.append({'path':path,'status':status,'content_type':ctype,'bytes':len(data)})
          evidence={'page_url':base,'source_commit':commit,'verified_at':datetime.now(timezone.utc).isoformat(),'checks':checks,'scope':'Public documentation only; no robot runtime tested'}
          Path('publication-http-checks.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2))
          print(json.dumps(evidence,ensure_ascii=False,indent=2))
          PY
      - name: Archive public HTTP verification
        uses: actions/upload-artifact@v4
        with:
          name: publication-http-checks
          path: publication-http-checks.json
          if-no-files-found: error
