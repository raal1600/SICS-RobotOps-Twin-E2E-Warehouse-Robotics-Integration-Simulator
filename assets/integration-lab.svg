<svg xmlns="http://www.w3.org/2000/svg" width="900" height="840" viewBox="0 0 900 840" role="img" aria-labelledby="title desc">
<title id="title">Integration Lab: explicit boundaries</title><desc id="desc">Figure 13. Implemented Integration Lab topology, with acceptance tracked in the current report. The console sends explicit REST authorizations and reads a persisted WebSocket trace. PostgreSQL commits immutable command/outbox intent before RabbitMQ publication. The separate edge service commits its inbox before consumer ACK and owns real OPC UA sessions to the virtual PLC. Bounded API-to-edge REST control calls preserve guided gates. PLC acceptance alone cannot actuate the runtime: explicit physical authorization and the original durable execution claim are required. The PLC-to-runtime interface is simulated; the existing runtime is invoked by the shared bounded handler. Fresh synthetic observations and the verifier determine the outcome. WMS HTTP acknowledgement precedes committed ERP business completion. Lost replies cause original-identity reconciliation, never an automatic replacement pick. This does not claim safety certification or exactly-once physical execution.</desc>
