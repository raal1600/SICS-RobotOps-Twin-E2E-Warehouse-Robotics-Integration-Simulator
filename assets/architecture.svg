<title id="title">Systemgränser och ägarskap</title><desc id="desc">Figur 2. Egen komponentarkitektur. Integrationskärnan äger uppdraget; Blender äger simulatortillståndet. Brain lämnar förslag och verifieraren bedömer observationer. PLC/cellkontroll är här en logisk emulering. Den dubbelriktade förbindelsen visar planbegäran och svar.</desc>
