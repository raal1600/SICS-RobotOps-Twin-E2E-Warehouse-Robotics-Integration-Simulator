<svg xmlns="http://www.w3.org/2000/svg" width="900" height="850" viewBox="0 0 900 850" role="img" aria-labelledby="title desc">
<title id="title">Systemgränser och ägarskap</title><desc id="desc">Figure 2. SIMULATOR_DESIGN architecture; revision-specific acceptance is stated separately. The durable workflow validates observed plans and preserves original command identity. The bounded Blender runtime owns private world/tool state and controller checkpoints. ObservationModel alone converts world data into WorldObservation with explicit sensor and simulated telemetry provenance; Verifier has no direct world path. Tool preparation shares the product-transfer command and does not add a transfer effect. Replay reads versioned artifacts. The API cell registry initializes new tests; retained archives remain read-only. Explicit confirmed deletion uses the test catalog, tombstones and bounded cleanup, never a robot command or verdict. Deleting the active test leaves no active world. Lost acknowledgement still requires original journal plus fresh sufficient observation, with no replacement pick.</desc>
