<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1050" viewBox="0 0 900 1050" role="img" aria-labelledby="title desc">
<title id="title">Tool preparation under the original command</title><desc id="desc">Figure 9. SIMULATOR_DESIGN implemented execution sequence; final acceptance status is stated separately. A valid original PICK_AND_PLACE intent is durable before cell preparation. Selection and availability checks can reject before any transfer. If the active tool is correct, TOOL_CHANGE_NOT_REQUIRED is recorded and the preparation branch is bypassed. Otherwise dock, release/empty-flange, engagement/tool-ID and retreat events share the original command identity. Restart never treats a missing reply as permission for another pick.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526473"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a34838"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
