<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Run, notice and investigate</title><desc id="desc">Figure 12. The operator runs a scenario and follows the recorded result into a bounded investigation panel. Symptoms, record findings and possible explanations stay distinct. Evidence and manual inspection use the same test/job identity; the timeline is secondary. Return preserves replay context. Only explicit re-observation invokes existing original-command reconciliation; replay, tabs and downloads issue no pick. Browser automation checks function, not first-time usability.</desc>
