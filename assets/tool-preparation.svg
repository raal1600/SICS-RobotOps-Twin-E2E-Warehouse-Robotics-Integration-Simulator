<rect x="40" y="415" width="350" height="100" rx="7" fill="#edf6f5" stroke="#126b70" stroke-width="1.3"/>
<rect x="40" y="425" width="4" height="80" rx="2" fill="#126b70"/>
<text x="215" y="459" font-size="19" text-anchor="middle" fill="#182f43" font-weight="700">MOVE_TO_SAFE_POSE</text>
<text x="215" y="485" font-size="16" text-anchor="middle" fill="#526473" font-weight="400">Then move to current tool dock</text>
