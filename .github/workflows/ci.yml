name: Deterministic acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked
      - name: Install pinned CPU Blender runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libgl1
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz -o "$RUNNER_TEMP/blender.tar.xz"
          echo 'a31f524fa99a527d3d52b7f5aaa68c34e1a19d5a1c9473f79c5cc610fd5b10e9  '"$RUNNER_TEMP/blender.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "BLENDER_EXECUTABLE=$RUNNER_TEMP/blender-5.2.1-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Deterministic suite
        run: uv run --locked python -m tools.dev test --junitxml=artifacts/tests.xml
      - name: Lint and format
        run: uv run --locked python -m tools.dev lint
      - name: Strict types
        run: uv run --locked python -m tools.dev typecheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-evidence
          path: artifacts/
          if-no-files-found: error
