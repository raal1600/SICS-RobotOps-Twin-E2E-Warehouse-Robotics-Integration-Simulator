[project]
name = "robotops-twin"
version = "0.1.0"
description = "Deterministic warehouse integration and uncertain-outcome simulator"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncua>=1.1.8",
    "fastapi",
    "httpx>=0.28.1",
    "pika>=1.3.2",
    "psycopg[binary]>=3.2",
    "pydantic",
    "uvicorn",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "jsonschema",
    "types-jsonschema",
    "bandit",
    "pip-audit",
    "playwright==1.63.0",
]
docs = ["markdown-it-py==4.2.0", "weasyprint==70.0", "pypdf>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "blender: exercises the real Blender executable (mandatory acceptance lane)",
    "lab_integration: requires live PostgreSQL and RabbitMQ (mandatory distributed acceptance lane)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
# Immutable pre-upgrade fixture provenance, byte-checked by compatibility tests.
extend-exclude = ["tools/build_publication.py", "tests/fixtures/legacy_v1/create_legacy_golden.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["robotops", "apps"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["robotops", "apps"]

[tool.coverage.report]
fail_under = 85
show_missing = true
